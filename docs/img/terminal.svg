<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-labelledby="t d">
  <title id="t">Example of the terminal during a debate</title>
  <desc id="d">The orchestrator shows each turn starting and finishing, with its verdict; when Codex asks something, the terminal shows the question, the person types the answer and the debate goes on until consensus and the report.</desc>
  <style>
    .t { font-family: Consolas, 'Cascadia Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 13.5px; fill: #e5e7eb; white-space: pre; }
    .gray { fill: #8b949e; } .cyan { fill: #56d4dd; } .green { fill: #7ee787; } .blue { fill: #79c0ff; }
    .magenta { fill: #e3a3f7; } .b { font-weight: 700; } .white { fill: #ffffff; }
  </style>
  <rect x="0" y="0" width="900" height="590" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="36" rx="12" fill="#21262d"/>
  <rect x="0" y="24" width="900" height="12" fill="#21262d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8b949e">~/my-project$ clodex start debates/2026-09-28-checkout</text>

  <text class="t" x="20" y="64"><tspan class="b white">━━ Clodex · Mobile checkout flow ━━</tspan></text>
  <text class="t gray" x="20" y="84">Claude → Codex · up to 3 cycle(s) · autonomy: ask · reporter: Claude · permissions: read</text>
  <text class="t gray" x="20" y="104">You can type here at any time:</text>
  <text class="t gray" x="20" y="124">  text + Enter     your message; the AIs read it before the next turn</text>
  <text class="t gray" x="20" y="144">  /pause  /resume  /stop  /stop now  /status  /help</text>

  <text class="t" x="20" y="174"><tspan class="cyan">▶</tspan> Turn 1 · <tspan class="b">Claude</tspan> started <tspan class="gray">(cycle 1 of 3)</tspan></text>
  <text class="t gray" x="20" y="194">  … Claude working for 1m00s</text>
  <text class="t" x="20" y="214"><tspan class="green">✔</tspan> Turn 1 · Claude finished in 4m12s · <tspan class="blue">CONTINUE</tspan> · <tspan class="gray">01-claude.md</tspan></text>
  <text class="t" x="20" y="234"><tspan class="cyan">▶</tspan> Turn 2 · <tspan class="b">Codex</tspan> started <tspan class="gray">(cycle 1 of 3)</tspan></text>
  <text class="t" x="20" y="254"><tspan class="green">✔</tspan> Turn 2 · Codex finished in 6m40s · <tspan class="magenta">QUESTION</tspan> · <tspan class="gray">02-codex.md</tspan></text>

  <text class="t magenta b" x="20" y="284">❓ Codex needs you (turn 2):</text>
  <text class="t" x="20" y="304">   1. Should express checkout come before the full form? Options: yes / no. I recommend: yes.</text>
  <text class="t magenta" x="20" y="324">Type your answer and press Enter (long text: @file.md).</text>
  <rect x="14" y="332" width="420" height="24" rx="4" fill="#1f2a37" stroke="#e3a3f7" stroke-opacity="0.5"/>
  <text class="t" x="20" y="349"><tspan class="gray">you ›</tspan> <tspan class="b white">Yes, express first.</tspan></text>
  <text class="t green" x="20" y="374">✉ Answer received. The debate continues.</text>
  <text class="t" x="20" y="394"><tspan class="magenta">✎</tspan> Turn 3 · Alex: your message was saved <tspan class="gray">03-alex.md</tspan></text>
  <text class="t" x="20" y="414"><tspan class="cyan">▶</tspan> Turn 4 · <tspan class="b">Claude</tspan> started <tspan class="gray">(cycle 2 of 3)</tspan></text>
  <text class="t gray" x="20" y="434">  ⋮</text>
  <text class="t" x="20" y="454"><tspan class="green">✔</tspan> Turn 6 · Codex finished in 3m05s · <tspan class="green">CONSENSUS</tspan> · <tspan class="gray">06-codex.md</tspan></text>
  <text class="t green" x="20" y="474">★ Consensus: all AIs agreed.</text>
  <text class="t" x="20" y="494"><tspan class="green">✔</tspan> Report written in 2m30s · <tspan class="gray">07-report.md</tspan></text>
  <text class="t" x="20" y="514"><tspan class="green">✔</tspan> Codex reviewed the report: <tspan class="green">accurate</tspan></text>
  <text class="t green b" x="20" y="544">■ Debate finished.</text>
  <text class="t" x="20" y="564">  Report: <tspan class="b">debates/2026-09-28-checkout/07-report.md</tspan></text>
</svg>
